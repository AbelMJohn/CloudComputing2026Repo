name: Deploy to GCP App Engine

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - show repo structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f -name "app.yaml" -o -name "requirements.txt" -o -name "main.py" -o -name "test_app.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            cd coc105-cicd-lab && pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            cd coc105-cicd-lab && python -m pytest tests
          fi
